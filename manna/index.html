The Finished Work gospel does not ask the heart to stop wanting. It does not call for the suppression of desire — it announces the fulfillment of it. What the heart was reaching for in the idol has already been secured, positionally, in union with Christ. The hook of sacrifice is severed because the one sacrifice has already been made and accepted, once for all, perfecting forever those being sanctified (Heb. 10:10, 14). There is nothing left to appease. There is nothing left to earn. The treadmill stops not because you ran fast enough, but because Another finished the race entirely. An idol cannot be removed by willpower or moral effort — the heart is a vacuum and will simply replace one idol with another. It is displaced only by a greater beauty. Thomas Chalmers called it the expulsive power of a new affection: you do not tear the idol down by trying harder — you see Christ more clearly, until the idol looks strange and dim by comparison. Orphaned striving gives way to the settled certainty of a child already home.`}},

{ id:"manna-2026-05-14", date:"2026-05-14", place:{it:"Woodlands, Texas",en:"Woodlands, Texas"},
  it:{title:"Come misuriamo ciò che facciamo nell'impiantare chiese?", body:`Se rifiutiamo i parametri aziendali del successo (bilanci, edifici e posti a sedere occupati), come misuriamo ciò che stiamo facendo?

I parametri di Dio sono completamente diversi.

In Zaccaria 2, un giovane esce con una corda per misurare Gerusalemme, per vedere quanto è larga e quanto è lunga. Cerca di quantificarla, di metterle un confine umano. Ma l'angelo in sostanza lo ferma e dice: «Gerusalemme sarà una città senza mura… Io sarò per lei un muro di fuoco tutt'intorno, dice il SIGNORE, e sarò la gloria in mezzo a lei».

L'istinto umano, soprattutto per un missionario che porta il peso di una visione, è misurare le mura: quantificare ciò che possiamo gestire e controllare. Ma il parametro di Dio non è la grandezza delle mura; è il calore del fuoco di Dio e la presenza della Sua gloria. Non lo si può letteralmente misurare con un metro.

E poi guardiamo la Nuova Gerusalemme in Apocalisse 21. L'angelo misura la città con una canna d'oro. E quali sono le misure? È un cubo perfetto. Lunghezza, larghezza e altezza sono esattamente uguali. L'unica altra cosa nella Scrittura a forma di cubo perfetto è il Santo dei Santi nel tabernacolo. Il parametro della nuova città non è la «crescita della chiesa»: il parametro è che l'intera città è diventata il Santo dei Santi. Il parametro è la dimora intima di Dio con l'uomo.

La regola d'oro della misura per il credente oggi è l'Opera Compiuta della Grazia di Dio. Siamo misurati come completi in Lui. È così che dobbiamo misurare noi stessi, misurare il successo e misurare l'Opera di Dio nelle missioni.`},
  en:{title:"How Do We Measure What We Are Doing in Church Planting?", body:`If we reject the corporate metrics of success—budgets, buildings, and butts in seats—how do we measure what we are doing?

God's metrics are entirely different.

When you look at Zechariah 2, a young man goes out with a measuring line to measure Jerusalem, to see how wide and long it is. He is trying to quantify it, to put a human boundary on it. But the angel essentially stops him and says: "Jerusalem will be a city without walls... For I will be a wall of fire around it, declares the Lord, and I will be the glory in her midst."

The human instinct, especially for a missionary carrying the weight of a vision, is to measure the walls - to quantify what we can manage and control. But God's metric isn't the size of the walls; it's the heat of the fire of God and the presence of His glory. You literally cannot measure that with a tape.

And then you look at the New Jerusalem in Revelation 21. The angel measures the city with a golden measuring rod. And what are the measurements? It's a perfect cube. The length, width, and height are exactly equal. The only other thing in Scripture shaped like a perfect cube is the Holy of Holies in the tabernacle. The metric of the new city isn't "church growth" - the metric is that the entire city has become the Holy of Holies. The metric is the intimate dwelling place of God with man.

The Golden Rule of measurement for the believer today is The Finished Work of the Grace of God. We are measured as complete in Him. That is how we must measure ourselves, measure success, and measure the Work of God in Missions.`}},

{ id:"manna-2026-04-26", date:"2026-04-26", place:{it:"Woodlands, Texas",en:"Woodlands, Texas"},
  it:{title:"La rabbia è un segnale", body:`Ciò per cui ci arrabbiamo rivela chi e che cosa adoriamo.
La rabbia non è il problema. È un segnale.

«Adiratevi e non peccate» (Ef 4:26) non ti dice di spegnere le tue emozioni: ti dice di restare in autorità su di esse. La rabbia significa che qualcosa conta. Qualcosa sembra violato, minacciato o fuori posto. Ma il problema non è il sentimento: è ciò che quel sentimento comincia a servire.

La rabbia rivela sempre il cuore.

«Da esso procedono le sorgenti della vita» (Pr 4:23). Quando la rabbia sale, mette a nudo ciò a cui ti stai aggrappando: ciò che ti aspetti, ciò che ritieni di meritare, ciò che stai cercando di proteggere. Se la rabbia è radicata nella verità, si muove verso la chiarezza e la giustizia. Se è radicata nell'io, si muove verso il controllo, l'orgoglio e la reazione. «L'ira dell'uomo non compie la giustizia di Dio» (Gc 1:20).

La rabbia ti mostra per che cosa stai vivendo in quel momento.

Allo stesso tempo, la rabbia è un segnale di confine.

Ti dice che qualcosa non va. Qualcosa va affrontato. Qualcosa ha bisogno di chiarezza. Ma «non peccate» significa che non usi la rabbia per punire le persone, controllare i risultati o abbattere qualcuno. Non violi un altro mentre cerchi di difendere te stesso. Ti assumi la responsabilità di come rispondi.

«La risposta dolce calma il furore, ma la parola dura eccita l'ira» (Pr 15:1).

Nelle relazioni, la rabbia o costruisce o distrugge.

Non resta neutrale. O si muove verso la verità e la riparazione, o si trasforma in accusa, disprezzo, chiusura difensiva o silenzio. Quando la rabbia diventa personale, quando attacca l'identità invece di affrontare la realtà, è già passata nel peccato.

«Sia tolta via da voi ogni amarezza, ogni ira e collera…» (Ef 4:31).

Il confine è questo: la rabbia diventa peccato quando smette di servire la verità e comincia a servire l'io.

Allora, che cosa significa «adirarsi e non peccare»?

Ti fermi.
Riconosci che cosa sta succedendo dentro di te.
Non reagisci alla massima intensità.
Porti il tuo cuore sotto la verità prima di aprire bocca.

«Chi è lento all'ira vale più del prode guerriero» (Pr 16:32).

Poi parli con chiarezza, senza attaccare. Affronti ciò che non va senza abbattere chi è la persona. Cerchi una soluzione, non una vittoria.

E non te la porti dietro.

«Il sole non tramonti sopra la vostra ira, e non date luogo al diavolo» (Ef 4:26–27). La rabbia non risolta non resta contenuta. Si indurisce in amarezza, distorce il tuo modo di pensare e apre la porta alla distruzione, dentro di te e nelle tue relazioni.

La rabbia è come il fuoco.

Al posto giusto, dà luce, calore e protezione.
Fuori controllo, brucia tutto, anche te.

«Adirarsi e non peccare» significa sentire profondamente senza perdere l'autorità sulla tua anima. Significa lasciare che la rabbia ti informi, ma mai che ti governi. È forza sotto controllo. Verità senza violenza. Convinzione senza distruzione.

La rabbia è un segnale.

Il peccato è ciò che accade quando segui la rabbia senza esaminarla.`},
  en:{title:"Anger Is a Signal", body:`What we get angry about reveals who and what we worship.
Anger is not the problem. It's a signal.

"Be angry, and do not sin" (Ephesians 4:26) is not telling you to shut your emotions down—it's telling you to stay in authority over them. Anger means something matters. Something feels violated, threatened, or out of order. But the issue is not the feeling—it's what that feeling begins to serve.

Anger always reveals the heart.

"Out of it spring the issues of life" (Proverbs 4:23). When anger rises, it's exposing what you're holding onto—what you expect, what you feel entitled to, what you're trying to protect. If anger is rooted in truth, it moves toward clarity and righteousness. If it's rooted in self, it moves toward control, pride, and reaction. "The wrath of man does not produce the righteousness of God" (James 1:20).

Anger shows you what you're living for in that moment.

At the same time, anger is a boundary signal.

It's telling you something is not okay. Something needs to be addressed. Something needs clarity. But "do not sin" means you don't use anger to punish people, control outcomes, or tear someone down. You don't violate someone else while trying to defend yourself. You take responsibility for how you respond.

"A soft answer turns away wrath, but a harsh word stirs up anger" (Proverbs 15:1).

In relationships, anger will either build or destroy.

It doesn't stay neutral. It either moves toward truth and repair, or it turns into accusation, contempt, defensiveness, or silence. Once anger becomes personal—once it attacks identity instead of addressing reality—it has crossed into sin.

"Let all bitterness, wrath, anger… be put away from you" (Ephesians 4:31).

The line is this: Anger becomes sin when it stops serving truth and starts serving self.

So what does it look like to "be angry and not sin"?

You pause.
You recognize what's happening in you.
You don't react at full intensity.
You bring your heart under truth before you open your mouth.

"He who is slow to anger is better than the mighty" (Proverbs 16:32).

Then you speak clearly, without attacking. You address what is wrong without tearing down who the person is. You pursue resolution, not victory.

And you don't carry it.

"Do not let the sun go down on your wrath, nor give place to the devil" (Ephesians 4:26–27). Unresolved anger doesn't stay contained. It hardens into bitterness, distorts your thinking, and opens the door to destruction—internally and relationally.

Anger is like fire.

In the right place, it gives light, warmth, and protection.
Out of control, it burns everything—including you.

To "be angry and not sin" is to feel deeply without losing authority over your soul. It's to let anger inform you, but never rule you. It's strength under control. Truth without violence. Conviction without destruction.

Anger is a signal.

Sin is what happens when you follow anger without examining it.`}},

{ id:"manna-2026-04-03", date:"2026-04-03", place:{it:"Woodlands, Texas",en:"Woodlands, Texas"},
  it:{title:"Venerdì Santo", body:`> **Luca 22:19–20**
>
> **19** E preso il pane, dopo aver reso grazie, lo spezzò e lo diede loro, dicendo: «Questo è il Mio corpo che è dato per voi; fate questo in memoria di Me».
>
> **20** Allo stesso modo, dopo la cena, prese il calice, dicendo: «Questo calice è il nuovo patto nel Mio sangue, che è versato per voi».

## La Comunione è partecipazione, non solo memoria
La parola «memoria» va più in profondità del semplice ricordo mentale. È un rivivere, un partecipare, un rendere presente qui e ora.

## La Comunione è unione con la Sua vita
«Il calice della benedizione che noi benediciamo, non è forse la comunione del sangue di Cristo?
Il pane che noi rompiamo, non è forse la comunione del corpo di Cristo?» (1 Cor 10:16)

La parola comunione (_koinonia_) significa:
- la Sua vita diventa la tua vita
- la Sua vittoria diventa la tua vittoria
- la Sua giustizia diventa la tua posizione davanti a Dio

La Comunione è unione con l'opera compiuta.

## L'Ultima Cena riguardava un'identità di nuovo patto
A quella tavola, tutto cambiò.

Non più:
- una relazione basata sulla legge
- un'accettazione basata sulla prestazione

Ma ora:
- una relazione acquistata con il sangue
- un'identità basata sulla grazia

«Questo calice è il nuovo patto nel Mio sangue…»

Non ti relazioni con Dio in base a:
- i tuoi fallimenti
- i tuoi successi
- i tuoi sentimenti

Ti relazioni con Lui in base al Suo sangue.

## La Comunione mette al centro di tutto la Persona di Cristo
Ogni volta che separiamo la dottrina dalla persona di Cristo, abbiamo un idolo.

La Comunione ci protegge da questo errore.

Ci riporta a:
- non dei principi → ma una Persona
- non un insegnamento → ma il Maestro
- non una religione → ma una relazione

«Poiché ogni volta che mangiate questo pane e bevete da questo calice, voi annunciate la morte del Signore, finché Egli venga» (1 Cor 11:26).

Annunciamo Lui, non soltanto ciò che ha fatto.

## La Comunione è dove il cuore arde di nuovo
Pensa alla via di Emmaus:

«Non ardeva forse il nostro cuore dentro di noi, mentre Egli ci parlava per la via…?» (Lc 24:32)

La Comunione è il luogo dove:
- la presenza di Dio diventa tangibile
- si fa esperienza del «profumo» di Cristo
- il cuore si riaccende

Questa è la comunione.

## La Comunione è riposo, non sforzo
Alla tavola:
- l'opera è compiuta
- il sacrificio è completo
- l'Agnello è stato accettato

Non vieni per:
- guadagnare qualcosa
- aggiustare te stesso
- dimostrare qualcosa

Vieni per:
- ricevere
- riposare
- dimorare

## Che cosa celebriamo oggi
Oggi la comunione significa:
- Cristo è presente con me adesso
- sono accettato grazie al Suo sangue
- partecipo della Sua vita e della Sua natura
- la mia identità è radicata in Lui
- riposo nella Sua opera compiuta

La Comunione è Cristo che dà Sé stesso a te, e tu che Lo ricevi di nuovo, consapevolmente, per fede: il Suo Corpo spezzato per il peccato e il Suo Sangue per il perdono.

REF: Mt 26:26–28 · Mc 14:22–24 · 1 Cor 11:23–25 · Is 53:12 · Es 24:8 · Ger 31:31–33 · Zc 9:11`},
  en:{title:"Good Friday", body:`> **Luke 22:19–20**
>
> **19** And taking bread, having given thanks, He broke and gave to them, saying, "This is My body being given for you; do this in remembrance of Me."
>
> **20** And likewise the cup after the supper, saying, "This cup is the new covenant in My blood, which is being poured out for you."

## Communion is Participation, Not Just Memory
The word remembrance is deeper than mental recall. It is a reliving, a participation, a bringing into the present in real time.

## Communion is Union with His Life
"The cup of blessing which we bless, is it not the communion of the blood of Christ?
The bread which we break, is it not the communion of the body of Christ?" (1 Corinthians 10:16)

The word communion (_koinonia_) means:
- His life becomes your life
- His victory becomes your victory
- His righteousness becomes your standing

Communion is union with the finished work.

## The Last Supper Was About a New Covenant Identity
At that table, everything changed.

No longer:
- Law-based relationship
- Performance-based acceptance

But now:
- Blood-bought relationship
- Grace-based identity

"This cup is the new covenant in My blood…"

You are not relating to God based on:
- Your failures
- Your successes
- Your feelings

You are relating to Him based on His blood.

## Communion Centers Everything on the Person of Christ
Anytime we separate doctrine from the person of Christ we have an idol.

Communion guards us from that error.

It brings us back to:
- Not principles → but a Person
- Not teaching → but the Teacher
- Not religion → but relationship

"For as often as you eat this bread and drink this cup, you proclaim the Lord's death till He comes." (1 Corinthians 11:26)

We proclaim Him, not just what He did.

## Communion is Where the Heart Burns Again
Think of the road to Emmaus:

"Did not our heart burn within us while He talked with us on the road…?" (Luke 24:32)

Communion is where:
- The presence of God becomes tangible
- The "fragrance" of Christ is experienced
- The heart is reignited

That is communion.

## Communion is Rest — Not Striving
At the table:
- The work is finished
- The sacrifice is complete
- The Lamb has been accepted

You are not coming to:
- Earn anything
- Fix yourself
- Prove anything

You are coming to:
- Receive
- Rest
- Abide

## What We Are Celebrating Today
Today, communion means:
- Christ is present with me now
- I am accepted because of His blood
- I share in His life and nature
- My identity is rooted in Him
- I rest in His finished work

Communion is Christ giving Himself to you—and you receiving Him again consciously, by faith, His Body broken for sin and His Blood for forgiveness.

REF: Matt 26:26–28 · Mark 14:22–24 · 1 Cor 11:23–25 · Isa 53:12 · Exod 24:8 · Jer 31:31–33 · Zech 9:11`}},

{ id:"manna-2026-03-31", date:"2026-03-31", place:{it:"Woodlands, Texas",en:"Woodlands, Texas"},
  it:{title:"Ricevi il Re", body:`> Luca 19:28–40

Stiamo sempre incoronando qualcosa che diventa un'autorità nella nostra anima, e che influisce sul nostro cuore, sulla nostra mente e sulle nostre emozioni.

La Domenica delle Palme segna il momento in cui Gesù entra a Gerusalemme come Re, pochi giorni prima della Sua crocifissione. Nell'antichità, quando un re tornava vittorioso dalla battaglia, la gente festeggiava stendendo a terra i mantelli e agitando rami.

## Ricevi il Re
La Domenica delle Palme è una dichiarazione pubblica: «Benedetto il Re che viene nel nome del SIGNORE; pace in cielo e gloria nei luoghi altissimi». Il Re viene, e la domanda non è se nella tua vita ci sarà un re, ma quale re regnerà.

## Nota che cosa hai incoronato
Usa queste affermazioni come uno specchio:
- «Qualunque cosa per cui vivi, la servi».
- «Non puoi vivere senza significato. E ciò che dà significato alla tua vita diventa la tua autorità».
- «E ciò che servi o ti renderà libero, o ti opprimerà».

Dai un nome alla cosa che più spesso decide il tuo clima emotivo (pace o ansia; libertà o pressione). Forse è proprio ciò che, di fatto, hai incoronato.

Metti alla prova gli idoli della cultura del nostro mondo:
- **Potere / controllo:** dove stai cercando di sentirti al sicuro attraverso il controllo?
- **Approvazione / amore:** dove ti aspetti che siano le persone a dirti che vali?
- **Comodità:** dove eviti le difficoltà per mantenere la vita gestibile?
- **Controllo dell'immagine / reputazione:** dove senti la pressione di essere visto come degno?

## Ci deve essere un Re nella nostra vita
Devi vivere per qualcosa. Il significato non è facoltativo. Perciò qualcosa occuperà sempre il posto di massima importanza nella tua vita.

## Come conosciamo Lui come Re?
1. Gesù deve spezzare, di fatto, tutti gli dèi in cui (senza saperlo) confidiamo, creando situazioni molto scomode che dimostrano che questi dèi ci deludono, o che noi deludiamo loro.
2. Quando la nostra fiducia in questi idoli si spezza, perché non ci danno un VERO controllo, approvazione, comodità e identità, scopriamo che Gesù è il Re di cui possiamo fidarci.
3. Sperimentiamo la pace celeste in ogni area della vita in cui incoroniamo Gesù come Re, prendendo la nostra croce e seguendoLo attraverso la risurrezione.

## Ritorna a Gesù come Re
«Se Lui è Re, può trasformare la tua vita». Regalità significa autorità, guida e trasformazione, non un semplice consiglio.`},
  en:{title:"Receive the King", body:`> Luke 19:28–40

We are always crowning something that becomes an authority in our soul, affecting our heart, mind and emotions.

Palm Sunday marks the moment when Jesus enters Jerusalem as King, just days before His crucifixion. In ancient times, when a king returned victorious from battle, people would celebrate by laying down garments and waving branches.

## Receive the King
Palm Sunday is a public declaration: "Blessed is the King who comes in the name of the LORD; peace in heaven and glory in the highest." The King comes, and the question is not whether there will be a king in your life, but which king will rule.

## Notice what you have crowned
Use these diagnostic statements as a mirror:
- "Whatever you live for, you serve."
- "You cannot live without meaning. And whatever gives your life meaning becomes your authority."
- "And whatever you serve will either free you—or oppress you."

Name the thing that most often sets your emotional weather (peace vs. anxiety; freedom vs. pressure). That may be what is functionally crowned.

Test the idols of our world culture:
- **Power / Control:** Where are you trying to stay safe through control?
- **Approval / Love:** Where are you looking to people to tell you that you are valuable?
- **Comfort:** Where are you avoiding difficulty to keep life manageable?
- **Control of Image / Reputation:** Where do you feel pressure to be seen as worthy?

## There must be a King in our life
You must live for something. Meaning is not optional. Therefore, something will always occupy the place of ultimate importance in your life.

## How do we know Him as King?
1. Jesus has to functionally break all the gods we (unknowingly) trust by creating very uncomfortable situations to prove that these gods fail us or we fail them.
2. When our trust is broken in these idols as they do not give us REAL control, approval, comfort, and identity; we discover that Jesus is the King we can trust.
3. We experience heavenly peace in every area of our life we crown Jesus King through taking up our cross and following Him through resurrection.

## Return to Jesus as King
"If He is King, He can transform your life." Kingship means authority, leadership, and transformation—not mere advice.`}},

  it:{title:"Quando la gratitudine sorge dopo la tempesta: il ringraziamento di Noè", body:`L'evento della storia biblica più vicino al cuore del Ringraziamento è il momento in cui Noè e la sua famiglia uscirono dall'arca, tornarono a posare i piedi sulla terra asciutta e offrirono un sacrificio di gratitudine al SIGNORE che li aveva portati attraverso la tempesta.

Quando pensiamo all'arca di Noè, spesso immaginiamo una barca di legno sballottata dalle acque in tempesta. Ma nella Scrittura l'arca è descritta con il linguaggio di un santuario: un luogo santo dove Dio stesso preserva la vita attraverso il giudizio. La stessa parola usata per l'arca di Noè è usata per l'Arca del Patto. Entrambe sono contenitori sacri. Entrambe sono avvolte dal linguaggio dell'espiazione. Entrambe sono luoghi in cui Dio protegge il Suo popolo.

L'arca non è una storia di abilità umana, ma di riparo divino. Non c'erano remi, né vele, né timone, né strategia. Noè non poteva guidare l'arca più di quanto noi possiamo guidare le tempeste che entrano nella nostra vita. L'unica direzione sull'arca era la presenza di Dio. L'unica sicurezza era la Sua copertura. E quando fu il momento, Dio stesso chiuse la porta. Dio stesso fece ritirare le acque. Dio stesso fece posare l'arca su un monte.

L'arca ci insegna qualcosa di semplice e potente:

> Dio ha sempre preparato una via per custodire il Suo popolo alla Sua presenza, anche quando il mondo crolla intorno a loro.

Come l'arca portò Noè al sicuro attraverso il giudizio, così Cristo, il nostro vero santuario, porta noi. Quando le nostre forze vengono meno e le onde si alzano, non dipendiamo dalla nostra capacità di tenere la rotta. Riposiamo in Colui che copre, preserva e ci conduce al sicuro in un giorno nuovo.

Possa questa verità acquietare oggi il tuo cuore:

> Quando Dio è il tuo santuario, la tempesta non può decidere il tuo futuro.`},
  en:{title:"When Gratitude Rises After the Storm: Noah's Thanksgiving", body:`The closest event in biblical history to the heart of Thanksgiving is that moment when Noah and his family stepped out of the ark, stood on dry ground again, and offered a sacrifice of gratitude to the Lord who carried them through the storm.

When we think of Noah's ark, we often picture a wooden boat tossed on stormy waters. But in Scripture, the ark is described in the language of a sanctuary—a holy place where God Himself preserves life through judgment. The same word used for Noah's ark is used for the Ark of the Covenant. Both are sacred containers. Both are covered with the language of atonement. Both are places where God protects His people.

The ark is not a story about human skill, but about divine shelter. There were no oars, no sails, no steering, no strategy. Noah could not guide the ark any more than we can guide the storms that come into our lives. The only direction on the ark was God's presence. The only safety was His covering. And when the time was right, God Himself shut the door. God Himself lifted the waters. God Himself rested the ark on a mountain.

The ark teaches us something simple and powerful:

> God has always made a way to keep His people in His presence, even when the world collapses around them.

Just as the ark carried Noah safely through judgment, so Christ—our true sanctuary—carries us. When our strength fails and the waves rise, we do not depend on our own ability to steer. We rest in the One who covers, preserves, and brings us safely into a new day.

May this truth quiet your heart today:

> When God is your sanctuary, the storm cannot decide your future.`}}

const esc = s => s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const inline = s => esc(s).replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>").replace(/(^|[\s(«"])_(.+?)_(?=$|[\s).,;:!?»"])/g,"$1<em>$2</em>");

function render(md){
  const out = []; let refs = "";
  for (const block of md.trim().split(/\n\s*\n/)) {
    const lines = block.split("\n");
    if (lines[0].startsWith("REF:")) { refs = inline(block.slice(4).trim()); continue; }
    if (lines[0].startsWith("### ")) { out.push("<h4>"+inline(lines[0].slice(4))+"</h4>"); lines.shift(); if (!lines.length) continue; }
    if (lines[0].startsWith("## ")) { out.push("<h3>"+inline(lines[0].slice(3))+"</h3>"); lines.shift(); if (!lines.length) continue; }
    if (lines.every(l => l.startsWith(">"))) {
      const html = lines.map(l => l.replace(/^>\s?/,"")).join("\n").split(/\n\n+/).map(p => p.trim()).filter(Boolean)
        .map(p => "<p>"+p.split("\n").map(inline).join("<br>")+"</p>").join("");
      out.push("<blockquote>"+html+"</blockquote>"); continue;
    }
    const firstList = lines.findIndex(l => /^(- |\d+\. )/.test(l));
    if (firstList > 0) out.push("<p>"+lines.slice(0,firstList).map(inline).join("<br>")+"</p>");
    if (firstList >= 0) {
      const items = lines.slice(firstList);
      if (/^\d+\. /.test(items[0])) {
        let html = "<ol>", open = false;
        for (const l of items) {
          if (/^\s+- /.test(l)) { if (!open) { html += "<ul>"; open = true; } html += "<li>"+inline(l.replace(/^\s+- /,""))+"</li>"; }
          else { if (open) { html += "</ul>"; open = false; } html += (html.endsWith("<ol>")?"":"</li>") + "<li>"+inline(l.replace(/^\d+\. /,"")); }
        }
        if (open) html += "</ul>";
        out.push(html+"</li></ol>");
      } else {
        out.push("<ul>"+items.map(l=>"<li>"+inline(l.replace(/^- /,""))+"</li>").join("")+"</ul>");
      }
      continue;
    }
    out.push("<p>"+lines.map(inline).join("<br>")+"</p>");
  }
  return {html: out.join(""), refs};
}

function fmtDate(iso){
  return new Date(iso+"T12:00:00Z").toLocaleDateString(UI[lang].locale,{day:"numeric",month:"long",year:"numeric",timeZone:"UTC"});

function excerpt(md){
  const plain = md.replace(/^## .*$/gm,"").replace(/^>.*$/gm,"").replace(/\*\*|_/g,"").replace(/^(- |\s+- |\d+\. )/gm,"").replace(/REF:.*$/m,"");
  return plain.replace(/\s+/g," ").trim().slice(0,220);
}

const BOOKLET = "## Introduzione\n\nQual è la forza che potrebbe guarirci più di qualsiasi altra cosa al mondo? Facciamo di tutto per essere guariti fisicamente. Facciamo di tutto per stare bene. Eppure la più grande forza di guarigione è così poco compresa.\n\nIl primo bisogno nella vita di ognuno è questo: essere amati da Dio. Sai qual è il secondo bisogno? Te lo dico io: essere amati da Dio. E ti dico anche qual è il terzo: essere amati da Dio.\n\nSono stato abbastanza chiaro?\n\n> «In questo sta l’amore: non che noi abbiamo amato Dio, ma che egli ha amato noi, e ha mandato suo Figlio per essere il sacrificio propiziatorio per i nostri peccati» (1 Giovanni 4:10).\n>\n> «Noi amiamo perché egli ci ha amati per primo» (1 Giovanni 4:19).\n\nVoglio che tu sappia che l’amore di Dio è venuto per primo: perciò il primo bisogno, per ogni tipo di guarigione, è essere amato da Dio così come sei. Dio ci ama esattamente come siamo, e continua ad amarci esattamente come siamo. L’amore di Dio, inoltre, non esige mai un cambiamento: piuttosto, lo produce.\n\nSe riesci a cogliere ciò che viene comunicato in queste pagine, il suo amore produrrà cambiamenti straordinari nella tua vita personale, nelle tue amicizie, nel tuo matrimonio e nella tua famiglia.\n\n## Capitolo primo · Mentre eravamo ancora peccatori\n\n> «Infatti, mentre noi eravamo ancora senza forza, Cristo, a suo tempo, è morto per gli empi. Difficilmente uno morirebbe per un giusto; ma forse per una persona buona qualcuno avrebbe il coraggio di morire; Dio invece mostra la grandezza del proprio amore per noi in questo: che, mentre eravamo ancora peccatori, Cristo è morto per noi» (Romani 5:6-8).\n\nGesù Cristo ha dimostrato il suo amore per noi morendo al nostro posto. Fermati un istante a immaginarlo. Non solo ci ha amati: ha fatto qualcosa. Noi non abbiamo fatto nulla. Non ci siamo ravveduti per indurre Dio ad amarci. Ci ha amati senza il nostro ravvedimento. Sto forse insinuando che possiamo vivere nel peccato? No, non è questo. Sto dicendo che l’amore di Dio produce un cambiamento, ma non lo esige mai.\n\nLasciati amare da Dio così come sei. Non cercare di amare Dio. Non cercare di amare gli altri. Nel momento stesso in cui ci provi, fallirai. Lasciati semplicemente amare da Dio. Ricevi un amore che non può mai venirti meno, un amore che non cambierà mai nei tuoi confronti.\n\n### Egli riposa nel suo amore\n\n> «Il Signore, il tuo Dio, è in mezzo a te, come un potente che salva; egli si rallegrerà con gran gioia per causa tua, si acqueterà nel suo amore, esulterà per causa tua con grida di gioia» (Sofonia 3:17).\n\nGesù Cristo ha versato il suo sangue ed è morto sulla croce per pagare i nostri peccati. È stato sepolto, è risorto ed è salito al cielo. Per questo, ora Dio riposa per sempre nel suo amore verso di noi. Ecco perché Romani 9:16 ci dice che il suo amore «non dipende né da chi vuole né da chi corre, ma da Dio che fa misericordia».\n\nGiovanni 1:12 dice: «A tutti quelli che l’hanno ricevuto egli ha dato il diritto di diventare figli di Dio: a quelli, cioè, che credono nel suo nome». Egli ci ha generati per sua volontà «mediante la parola di verità» (Giacomo 1:18).\n\n### Relazioni malate rese sane\n\nLascia che sia molto pratico. Come affronto una relazione malata? Preoccupandomene? Condannandomi? Sentendomi in colpa? Facendo bella figura nella mia carne (Galati 6:12)? No. Quando una relazione è malata, lascio semplicemente che la Parola di Dio sia vera e lascio che lui mi ami.\n\nSe fallisco, lascio che Dio mi ami. Non ho la forza di cambiare: lascio che sia Dio a cambiarmi. Il suo amore fallisce? No. Cambierà? No, non cambierà.\n\n## Capitolo secondo · Così come sei\n\nDi recente mi ha telefonato un uomo. Si trova in condizioni molto gravi: è risultato positivo al virus che causa l’AIDS. Nell’arco di quindici anni è caduto tre volte nella sua debolezza. La terza volta ha contratto l’HIV, e ora vuole morire. Provava una vergogna enorme quando lo ha detto a sua moglie.\n\nChe cosa può fare? Odia già ciò che ha fatto. In questo momento, quest’uomo ha bisogno di lasciare che Dio lo ami tanto quanto prima di sapere di avere l’HIV.\n\nLasciare che Dio ci ami non produce sregolatezza. Al contrario, ci insegna a rinunciare all’empietà e a vivere in tranquillità, con la Parola di Dio che abita abbondantemente nel nostro cuore.\n\nLa cosa più bella è lasciare che Dio ti ami così come sei. Ho un motivo per ripetere questa frase: lasciare che Dio ti ami è l’unico modo in cui la memoria e l’anima possono essere guarite. L’unico modo in cui l’immagine di sé e gli atteggiamenti possono cambiare è lasciare che Dio ti ami. Il motivo per cui certi uomini non riescono ad amare come si deve la propria moglie è semplicissimo: non capiscono come lasciarsi amare da Dio.\n\n### Conformi all’immagine del Figlio\n\n> «Or sappiamo che tutte le cose cooperano al bene di quelli che amano Dio, i quali sono chiamati secondo il suo disegno. Perché quelli che ha preconosciuti, li ha anche predestinati a essere conformi all’immagine del Figlio suo, affinché egli sia il primogenito fra molti fratelli; e quelli che ha predestinati, li ha pure chiamati; e quelli che ha chiamati, li ha pure giustificati; e quelli che ha giustificati, li ha pure glorificati» (Romani 8:28-30).\n\nNella sua prescienza, Dio sapeva che con la mia volontà avrei scelto di credere in suo Figlio. Sono stato giustificato, santificato e glorificato perché Dio è sempre stato dalla mia parte. Ed egli riposa nel suo amore verso di me, perché i miei peccati sono stati pagati dal Figlio.\n\nMi telefonò una persona di un’altra chiesa. Mi disse: «Ti ho attaccato, ti ho odiato e ho combattuto contro Dio. Ho ventinove anni, sto morendo e voglio ravvedermi».\n\nGli risposi: «L’unica cosa che mi interessa è che tu lasci che Dio ti ami».\n\nLui disse: «Ho l’AIDS. Sto per morire».\n\n«Lasciati semplicemente amare, lascia che Dio ti ami», gli dissi. «Nello stato in cui ti trovi, lasciati soltanto amare».\n\nAveva sbagliato, ma l’unica cosa di cui aveva bisogno era essere amato da Dio. Andai a trovarlo ogni giorno e continuai a ripetergli: «Lascia che Dio ti ami». Nel giro di dodici settimane quell’uomo uscì dall’ospedale e fu battezzato nella chiesa che in passato aveva odiato. Dio lo cambiò. I pensieri, le emozioni e le decisioni di quest’uomo cominciarono a esprimersi secondo la Parola di Dio. Il suo cuore fu cambiato, poi la sua anima, poi la sua mente. Cominciò ad amare la moglie con cui aveva combattuto per anni, e cominciò ad amare le sue due figlie. E mentre cominciava ad amare la chiesa, cominciò ad amare i perduti.\n\nIl punto decisivo, per quest’uomo, era che non amava se stesso. Dentro di sé non riusciva ad amarsi, e non credeva che Dio lo amasse. In chiesa testimoniò che il suo corpo era stato guarito. Ecco che cosa può fare l’amore nella volontà di Dio. Il Signore non esigette un cambiamento: lo produsse con il suo amore.\n\nPiù lascio che Dio mi ami senza mettermi sotto processo, più lascio che Dio mi ami senza paura di fallire, più lascio che Dio mi ami senza essere risentito e adirato verso gli altri, più ogni cosa nella mia vita viene guarita. Nella volontà sovrana di Dio sarò guarito, qualunque sia il problema. Il mio cuore, la mia anima e le mie emozioni saranno guariti semplicemente lasciando che Dio mi ami.\n\n## Capitolo terzo · L’amore fa nascere nuovi inizi\n\nUna bambina di dodici anni venne da me a parlarmi della situazione terribile che viveva in casa. I genitori erano raramente presenti; uno dei due se ne andava nei fine settimana. C’erano urla e litigi. C’era l’alcolismo. Mi disse: «Ho paura di tornare a casa perché non so che cosa fare. Lei è il mio pastore: potrebbe venire a casa nostra?».\n\nAndai a casa loro. In modo davvero singolare, la bambina disse a suo padre: «Voglio che tu ascolti il pastore». Così cominciai a parlargli. «Sa che migliaia di anni fa Gesù sapeva che oggi io sarei stato qui come servo di Dio?». E aggiunsi: «Signore, se potessi mettere in parole quanto Dio la ama in questo preciso momento, lo farei. Se potessi esprimere il suo amore a parole e lei riuscisse in qualche modo a crederci, in questa casa le cose cambierebbero».\n\nMi raccontò quanto la famiglia fosse disfunzionale e distruttiva. «È vero», dissi. «Ma prima di tutto voglio che lei si lasci amare da Dio, senza condanna. Non le chiederò nemmeno di cambiare le sue abitudini con l’alcol. Lasci semplicemente che Dio la ami». Lì, davanti a me, pianse come un bambino.\n\nQuella sera, dopo il culto, uscimmo insieme e quell’uomo accettò Gesù Cristo. Non bevve mai più. In seguito anche sua moglie accettò il Salvatore. Furono battezzati insieme, e quella bambina di dodici anni visse il giorno più bello della sua vita. La famiglia si fece una fotografia e me la regalò. Che testimonianza di ciò che può fare il lasciarsi amare da Dio!\n\n### Dimenticare il passato\n\nNon andai in quella casa per discutere di quanto quel padre fosse cattivo. Sul piano genetico, psicologico ed emotivo avremmo potuto trovare ogni sorta di spiegazione per come stavano le cose. Ma andai lì per dirgli che Dio aveva creato quell’uomo a propria immagine e per raccontargli quanto Dio fosse innamorato di lui in quel momento. Non ci fu alcuna discussione sui peccati. Lasciai che fosse l’amore di Dio a produrre il ravvedimento. Il papà di quella bambina fu cambiato e ricevette un inizio completamente nuovo.\n\nL’amore di Dio produsse una nuova immagine di sé.\nL’amore di Dio produsse una nuova consapevolezza.\nL’amore di Dio produsse fede.\nL’amore di Dio produsse speranza.\nL’amore di Dio rivelò misericordia.\nL’amore di Dio rivelò grazia.\n\nQuei genitori resero personale il suo amore. Lo interiorizzarono. L’amore di Dio fu impartito loro e divenne parte di loro. C’è da stupirsi che 1 Corinzi 13:8 dica che l’amore non verrà mai meno?\n\n### Condotti alla luce\n\n> «Io sopporterò l’indignazione del Signore, perché ho peccato contro di lui, finché egli difenda la mia causa e mi faccia giustizia; egli mi condurrà alla luce e io contemplerò la sua giustizia» (Michea 7:9).\n\nIl profeta Michea era abbattuto quando scrisse queste parole. Aveva peccato, ma comprendeva l’amore di Dio per lui. Sapeva che Dio era proprio lì, in basso, insieme a lui. Michea sapeva che sarebbe tornato indietro grazie alla luce dell’amore, e che avrebbe ricevuto il perdono.\n\nL’amore di Dio garantisce che Dio ti ama così come sei, come un peccatore senza forza. Ti giustifica mentre sei empio (Romani 4:5). Ti rende giusto a prescindere dalla legge e dalle opere (Romani 4:6). Ti santifica. Per mezzo del suo amore, Gesù è fatto per te «giustizia, santificazione e redenzione» (1 Corinzi 1:30). L’amore di Dio garantisce che non ti sarà mai più imputato un altro peccato. Garantisce anche che, se continuerai nel peccato, l’amore di Dio ti disciplinerà a motivo dell’amore, non al di fuori di esso. La disciplina viene per proteggere, per dare la mente di Cristo e, in ultima analisi, per benedire.\n\n## Capitolo quarto · Nell’amore di Dio non ci sono «se»\n\n> «Il Signore mi è apparso da lontano: “Io ti amo di un amore eterno; perciò ti ho attirata a me con bontà”» (Geremia 31:3).\n\nQuando Dio disse queste parole, la nazione d’Israele stava adorando gli idoli. Non disse: «Ti amerò se ti metterai in riga». Non disse: «Ti amerò se smetterai di adorare gli idoli».\n\nNo, Dio disse: «Io ti amo di un amore eterno». Ci sono tanti «se» nelle nostre relazioni — tanti «se» che ostacolano la guarigione mentale ed emotiva e che a volte bloccano perfino quella fisica. Ma Dio non dice: «Ti amerò se…». Dice: «Ti ho amato, anche mentre eri “là fuori”».\n\nIl padre non amava forse il figlio prodigo mentre era “là fuori”, in un paese lontano, tanto quanto quando era a casa? Sì, lo amava. L’amore del padre non cambiò mentre il prodigo viveva nel peccato. Quell’amore aspettò soltanto, con pazienza, di poter dare grazia a suo figlio. Quando la sua volontà decise che era ora di tornare a casa, così com’era, il prodigo ricevette perdono e purificazione. Il padre gli diede un anello, una veste, calzari nuovi e una festa di bentornato. Uccisero il vitello ingrassato per la celebrazione, e tutto questo accadde perché il figlio tornò a casa così com’era (Luca 15:11-24).\n\nPensa a tutto ciò che è accaduto nella società. Considera le profondità del peccato di oggi. Considera la terribile disfunzione nelle famiglie e nelle persone. Con tutto quello che succede, la cosa di cui il genere umano ha più bisogno è capire quanto Dio ci ama. Il grande problema non è affrontare il peccato. Affronta il fatto di quanto Dio ti ama, e sarà l’amore di Dio a occuparsi del peccato. L’amore di Dio produrrà il cambiamento.\n\n### Sparso nel cuore\n\n> «E la speranza non delude, perché l’amore di Dio è stato sparso nei nostri cuori mediante lo Spirito Santo che ci è stato dato» (Romani 5:5).\n\nLo Spirito Santo sparge l’amore di Dio nel cuore, e l’amore è il frutto dello Spirito. Quando ricevo il suo amore, occupandomi soltanto del fatto che lui mi ama, allora è la disposizione di Dio a prendere il sopravvento. Entra il suo temperamento. Forse non me ne rendo nemmeno conto, ma lo sto ricevendo, mentre la sua natura entra in me e comincia a comunicare e ad avere comunione con me. E la natura di Dio non pecca.\n\n### Cambiare rotta\n\n> «Nei quali un tempo camminaste seguendo l’andazzo di questo mondo, seguendo il principe della potenza dell’aria, di quello spirito che opera oggi negli uomini ribelli. Nel numero dei quali anche noi tutti vivevamo un tempo, secondo i desideri della nostra carne, ubbidendo alle voglie della carne e dei nostri pensieri; ed eravamo per natura figli d’ira, come gli altri.\n>\n> «Ma Dio, che è ricco in misericordia, per il grande amore con il quale ci ha amati, anche quando eravamo morti nei peccati, ci ha vivificati con Cristo (è per grazia che siete stati salvati), e ci ha risuscitati con lui e con lui ci ha fatti sedere nei luoghi celesti in Cristo Gesù» (Efesini 2:2-6).\n\nNon importa in che cosa stai camminando. In passato tutti noi camminavamo seguendo l’andazzo di questo mondo. Eravamo tutti controllati dal principe della potenza dell’aria, come figli della disubbidienza. Ma Dio, ricco di grazia e ricco di misericordia, ha un grande amore «con il quale ci ha amati» (Efesini 2:4). Ed è per mezzo di quell’amore che vengono i cambiamenti.\n\nPer ogni credente, l’amore di Dio era già lì, pronto per noi. È il conoscere quanto eravamo amati che ci ha portati a essere salvati per grazia, mediante la fede in Gesù Cristo. Egli è entrato nella nostra vita, e l’amore del Padre, del Figlio e dello Spirito Santo è diventato qualcosa di interiore e di personale.\n\nOnde di amore possono scorrere ogni giorno attraverso le cellule del tuo corpo. Non è emozione umana: è amore divino.\n\n«Non ho fatto la cosa giusta», dici.\n\nAccetta semplicemente l’amore di Dio per ciò che hai sbagliato.\n\n«Non mi sento spirituale».\n\nAccetta l’amore anche se non senti nulla.\n\nRicevi soltanto il suo amore, e produrrà non solo amore, ma anche gioia, pace, sopportazione, pazienza, bontà divina, benevolenza, fedeltà, mansuetudine e autocontrollo.\n\n### Il giogo leggero dell’amore\n\n> «Venite a me, voi tutti che siete affaticati e oppressi, e io vi darò riposo. Prendete su di voi il mio giogo e imparate da me, perché io sono mansueto e umile di cuore; e voi troverete riposo alle anime vostre; poiché il mio giogo è dolce e il mio carico è leggero» (Matteo 11:28-30).\n\nSai qual è il suo giogo? È l’amore. Quando prendo su di me il suo giogo, sto semplicemente scegliendo di prendere su di me il suo amore. «In questo sta l’amore: non che noi abbiamo amato Dio, ma che egli ha amato noi, e ha mandato suo Figlio per essere il sacrificio propiziatorio per i nostri peccati… Noi amiamo perché egli ci ha amati per primo» (1 Giovanni 4:10, 19). Non c’è da stupirsi che il suo giogo sia dolce. Non c’è da stupirsi che imparare da lui produca riposo per la mia anima. Il Padre riposa nel suo amore (Sofonia 3:17). Io prendo il giogo. Lascio che Gesù mi ami così come sono. E allora è lui a produrre in me quel cambiamento, grazie alla potenza dell’amore, alla dinamica dell’amore, alla fede dell’amore, alla grazia dell’amore e alla presenza dell’amore. Finalmente il cambiamento arriva, e io sono guarito.\n\n### Prima ama te stesso\n\nC’è un ordine nell’amore di Dio. Non devo amare per primi gli altri: devo amare prima me stesso. Non posso nemmeno amare Dio se non amo me stesso. Devo lasciare che Dio mi ami. È così che funziona. Primo: lascio che Dio mi ami. Secondo: amo me stesso. Terzo: amo Dio. E infine sono pienamente libero di amare te e tutti gli altri — perfino i miei nemici.\n\nQuando ami te stesso, nasce una nuova immagine di te, una nuova consapevolezza di te. Ricevi un nuovo senso di essere speciale, un nuovo senso di essere reso giusto davanti a Dio grazie alla santificazione mediante il sangue di Cristo. Non c’è più nulla tra te e Dio. Non c’è più nulla tra te e chiunque altro. Sei amato e ami nella potenza dello Spirito Santo. Non sto parlando di sentimentalismo o di carnalità: sto parlando di ciò che la Bibbia dice sull’amore di Dio per noi mentre siamo ancora peccatori.\n\nC’è da stupirsi che Davide abbia detto che le compassioni del Signore sono grandi (2 Samuele 24:14)? C’è da stupirsi che Pietro lo abbia chiamato «il Dio di ogni grazia» (1 Pietro 5:10)? Paolo lo ha chiamato «il Padre misericordioso e Dio di ogni consolazione» (2 Corinzi 1:3).\n\n«Abraamo», chiamò Dio. «Non mi parli da tredici anni, ma io ti amo».\n\n«Giacobbe. Te ne sei andato e sei stato lontano da me per vent’anni. Ma io ti amo ancora e ti userò» (Genesi 32).\n\n«Gedeone. Ti stai nascondendo e non vuoi essere usato», dice. «Ma io ti amo proprio dove sei. Calmerò le tue paure e porterò una grande vittoria» (Giudici 6).\n\n«Sansone. Hai sbagliato con Dalila. Ma io ti amo. Ora riprenditi la tua forza e distruggi i tuoi nemici» (Giudici 16).\n\n«Pietro. Mi hai rinnegato e mentre lo facevi hai perfino imprecato. Pubblicamente mi hai abbandonato, ma io ti amo. Predicherai questo grande messaggio alla folla dopo che lo Spirito Santo sarà venuto su di te» (Atti 1).\n\n«Paolo. Hai ucciso dei cristiani. Hai assistito alla lapidazione di Stefano. Eppure ti ho amato. Ti ho salvato e ti userò potentemente tra i pagani» (Atti 22).\n\nIn Giovanni 13:1 la Bibbia dice che «li amò sino alla fine». Che cosa significa? Sino alla fine? Significa che nulla cambiò l’amore di Gesù Cristo per i suoi discepoli. Si allontanarono. Lo rinnegarono. Lo abbandonarono quando aveva più bisogno di loro, ma questo non cambiò il suo amore. Li amò sino alla fine — e così amerà te e me sino alla fine.\n\n## Conclusione\n\n> «E ho questa fiducia: che colui che ha cominciato in voi un’opera buona, la condurrà a compimento fino al giorno di Cristo Gesù» (Filippesi 1:6).\n\nSe sei intrappolato nel peccato, lascia che Dio ti ami lì dove sei, e lascia che produca nella tua vita un cambiamento puro. Si tratta soltanto di rispondere al suo amore, tutto qui. La mia unica speranza è che queste parole ti abbiano spinto a lasciarti amare da lui e ad andare avanti.\n\nDio è amore. Egli perdona ogni cosa. Io sono stato perdonato, tu sei stato perdonato. Siamo stati lavati, purificati mediante la fede. Il suo amore non viene mai meno, e non manca mai di cambiarci. E oltre a questo, il suo amore non mancherà mai di cambiare gli altri attraverso di noi. È la forza più dinamica che ci sia in questo mondo: lasciamola dunque libera di agire!";

}

for (const b of document.querySelectorAll(".lang button")) b.addEventListener("click", () => {
